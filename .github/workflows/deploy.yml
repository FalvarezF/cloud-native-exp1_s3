name: Build and deploy tickets API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish ARM64 image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema-tickets:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema-tickets:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Load SSH key and known host
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart application on EC2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          EFS_MOUNT_PATH: ${{ vars.EFS_MOUNT_PATH }}
          EFS_HOST_PATH: ${{ vars.EFS_HOST_PATH }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME secret}"
          : "${EC2_HOST:?Set the EC2_HOST secret}"
          : "${EC2_USER:?Set the EC2_USER secret}"
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${S3_BUCKET:?Set the S3_BUCKET repository variable}"
          : "${EFS_MOUNT_PATH:?Set the EFS_MOUNT_PATH repository variable}"
          : "${EFS_HOST_PATH:?Set the EFS_HOST_PATH repository variable}"

          image="${DOCKERHUB_USERNAME}/sistema-tickets:${IMAGE_TAG}"
          printf -v remote_args '%q ' "$image" "$AWS_REGION" "$S3_BUCKET" "$EFS_MOUNT_PATH" "$EFS_HOST_PATH"

          ssh -o BatchMode=yes "$EC2_USER@$EC2_HOST" "bash -s -- $remote_args" <<'REMOTE'
          set -euo pipefail
          image="$1"
          aws_region="$2"
          s3_bucket="$3"
          efs_mount_path="$4"
          efs_host_path="$5"

          if ! mountpoint -q "$efs_mount_path"; then
            echo "EFS is not mounted at $efs_mount_path" >&2
            exit 1
          fi

          sudo install -d -o 10001 -g 10001 "$efs_host_path"
          sudo docker pull "$image"

          if sudo docker container inspect sistema-tickets >/dev/null 2>&1; then
            sudo docker rm -f sistema-tickets
          fi

          sudo docker run -d \
            --name sistema-tickets \
            --restart unless-stopped \
            -p 8080:8080 \
            -e EFS_DIRECTORY=/app/tickets \
            -e AWS_REGION="$aws_region" \
            -e S3_BUCKET="$s3_bucket" \
            -e S3_AUTO_UPLOAD=false \
            -v "$efs_host_path:/app/tickets" \
            "$image"

          sleep 5
          if [ "$(sudo docker inspect -f '{{.State.Running}}' sistema-tickets)" != "true" ]; then
            sudo docker logs --tail 100 sistema-tickets
            exit 1
          fi
          sudo docker ps --filter name=sistema-tickets
          REMOTE
